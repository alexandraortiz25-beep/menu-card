<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
   
    <h1>Alex's Food Truck Menu Card</h1>


<form id="menu-form">
<label for="menu-input">Paste your menu as JSON</label>
<textarea id="menu-input" rows="8">[
{"name": "Coffee", "price": 3},
{"name": "Latte", "price": 5},
{"name": "Cappuccino", "price": 4},
{"name": "Iced Coffee", "price": 4}
]</textarea>
<button type="submit">Show my menu</button>
</form>

<p id="count"></p>
<p id="menu-text"></p>

<script src="script.js"></script>
</body>
</html>
